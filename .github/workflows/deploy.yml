name: Deploy to GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy-app:
        description: 'Deploy App (frontend + backend)'
        type: boolean
        default: false
      deploy-video-function:
        description: 'Deploy Video Function'
        type: boolean
        default: false
      deploy-all:
        description: 'Deploy All Components'
        type: boolean
        default: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.determine-deploy.outputs.app }}
      video-function: ${{ steps.determine-deploy.outputs.video-function }}
    steps:
      - name: Checkout code
        if: github.event_name == 'push'
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Detect file changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v2
        id: detect-changes
        with:
          filters: |
            app:
              - 'backend/**'
              - 'frontend/**'
              - 'shared/python/**'
              - 'Dockerfile'
              - 'entrypoint.sh'
              - 'cloudbuild.yaml'
              - '.github/workflows/deploy*.yml'
            video-function:
              - 'cloud-functions/**'
              - 'shared/python/**'
              - '.github/workflows/deploy*.yml'

      - name: Determine what to deploy
        id: determine-deploy
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual deployment triggered"
            if [ "${{ github.event.inputs.deploy-all }}" == "true" ]; then
              echo "app=true" >> $GITHUB_OUTPUT
              echo "video-function=true" >> $GITHUB_OUTPUT
            else
              echo "app=${{ github.event.inputs.deploy-app }}" >> $GITHUB_OUTPUT
              echo "video-function=${{ github.event.inputs.deploy-video-function }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "Automatic deployment based on file changes"
            echo "app=${{ steps.detect-changes.outputs.app }}" >> $GITHUB_OUTPUT
            echo "video-function=${{ steps.detect-changes.outputs.video-function }}" >> $GITHUB_OUTPUT
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.app == 'true' ||
      needs.detect-changes.outputs.video-function == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: app
          - component: video-function

    steps:
      - name: Check if component should deploy
        id: should-deploy
        run: |
          case "${{ matrix.component }}" in
            "app")
              if [ "${{ needs.detect-changes.outputs.app }}" == "true" ]; then
                echo "deploy=true" >> $GITHUB_OUTPUT
              else
                echo "deploy=false" >> $GITHUB_OUTPUT
              fi
              ;;
            "video-function")
              if [ "${{ needs.detect-changes.outputs.video-function }}" == "true" ]; then
                echo "deploy=true" >> $GITHUB_OUTPUT
              else
                echo "deploy=false" >> $GITHUB_OUTPUT
              fi
              ;;
          esac

      - name: Checkout code
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install Google Cloud CLI
        if: steps.should-deploy.outputs.deploy == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli

      - name: Deploy App
        if: matrix.component == 'app' && steps.should-deploy.outputs.deploy == 'true'
        run: |
          gcloud builds submit . \
            --config cloudbuild.yaml \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --substitutions=_NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }},_NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

          gcloud run deploy turbulent-app \
            --image us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/field-notes/turbulent-app \
            --platform managed \
            --region us-central1 \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --allow-unauthenticated \
            --service-account=${{ vars.GCP_SERVICE_ACCOUNT_NAME }} \
            --memory=1Gi \
            --min-instances=1 \
            --startup-cpu-boost \
            --set-env-vars "MONGO_USER=${{ secrets.MONGO_USER }},MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }},MONGO_CLUSTER=${{ vars.MONGO_CLUSTER }},MONGO_APP_NAME=${{ vars.MONGO_APP_NAME }},MONGO_HOST=${{ vars.MONGO_HOST }},MONGO_DB_NAME=${{ vars.MONGO_DB_NAME }}" \
            --set-env-vars "GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }},ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" \
            --set-env-vars "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }},NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }},NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }},NEXTAUTH_DEBUG=${{ vars.NEXTAUTH_DEBUG }}" \
            --set-env-vars "GH_TOKEN=${{ secrets.GH_TOKEN }},GH_USERNAME=${{ vars.GH_USERNAME }}" \
            --set-env-vars "QDRANT_URL=${{ vars.QDRANT_URL }},QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }},VOYAGE_API_KEY=${{ secrets.VOYAGE_API_KEY }},ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --set-env-vars "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_APP_PASSWORD=${{ secrets.SMTP_APP_PASSWORD }},CONTACT_NOTIFY_EMAIL=${{ vars.CONTACT_NOTIFY_EMAIL }}" \
            --timeout=600s

          gcloud run services add-iam-policy-binding turbulent-app \
            --region us-central1 \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Deploy Video Processing Function
        if: matrix.component == 'video-function' && steps.should-deploy.outputs.deploy == 'true'
        run: |
          gcloud builds submit . \
            --config cloud-functions/video-processor/cloudbuild.yaml

          MONGODB_URI="mongodb+srv://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@${{ vars.MONGO_CLUSTER }}.${{ vars.MONGO_HOST }}/${{ vars.MONGO_DB_NAME }}?retryWrites=true&w=majority&appName=${{ vars.MONGO_APP_NAME }}"

          gcloud run deploy video-processor \
            --image us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/field-notes/video-processor \
            --platform managed \
            --region us-central1 \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --no-allow-unauthenticated \
            --service-account="${{ vars.GCP_SERVICE_ACCOUNT_NAME }}" \
            --set-env-vars="GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }},MONGODB_URI=${MONGODB_URI},API_BASE_URL=${{ vars.NEXT_PUBLIC_API_URL }}" \
            --memory=2Gi \
            --timeout=540s \
            --max-instances=5 \
            --cpu=1

          gcloud eventarc triggers describe video-processor-trigger \
            --location=us-central1 \
            --project=${{ vars.GCP_PROJECT_ID }} 2>/dev/null || \
          gcloud eventarc triggers create video-processor-trigger \
            --location=us-central1 \
            --project=${{ vars.GCP_PROJECT_ID }} \
            --destination-run-service=video-processor \
            --destination-run-region=us-central1 \
            --event-filters="type=google.cloud.storage.object.v1.finalized" \
            --event-filters="bucket=${{ vars.GCS_BUCKET_NAME }}" \
            --service-account="${{ vars.GCP_SERVICE_ACCOUNT_NAME }}"

  deployment-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary"
          echo "App: ${{ needs.detect-changes.outputs.app }}"
          echo "Video Function: ${{ needs.detect-changes.outputs.video-function }}"
