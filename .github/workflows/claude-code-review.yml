name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR thoroughly. Flag:
            - Bugs, logic errors, off-by-one mistakes, race conditions
            - Security vulnerabilities (XSS, injection, auth bypass, secrets in code)
            - Missing error handling that could break production
            - Breaking API changes (backend contract changes without frontend updates, missing migrations)
            - Performance issues (N+1 queries, unnecessary re-renders, missing indexes)
            - Dead code or unused imports introduced in this PR
            - Inconsistencies with patterns established in the codebase

            Do not comment on: style preferences, naming bikeshedding, or suggestions to add features not in the PR scope. Do not summarize what the PR does.

            If there are no issues worth flagging, say so in one line. If there are issues, list them as bullet points with file:line references. Be direct.

            Use the repository's CLAUDE.md for guidance on conventions.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

