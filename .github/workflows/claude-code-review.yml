name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/**/*.js"
      - "frontend/src/**/*.jsx"
      - "backend/**/*.py"

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review ONLY the diff of this PR. Do not read files outside the diff unless needed to verify a specific concern.

            Report a MAXIMUM of 5 findings. Only report issues you are confident are real bugs or security vulnerabilities:
            - Security vulnerabilities (XSS, injection, auth bypass, secrets in code)
            - Bugs that will cause runtime errors, data loss, or incorrect behavior
            - Breaking API contract changes (missing migrations, mismatched types)

            Do NOT review:
            - Documentation, markdown, README, or comment changes
            - Style, naming, formatting, or import ordering
            - Test files (unless a test is asserting wrong behavior)
            - Suggestions for features not in the PR scope

            Rules:
            - Each finding: one sentence + file:line reference. No elaboration.
            - Do not summarize the PR.
            - Do not repeat findings across categories.
            - If nothing worth flagging, say "No issues found." and stop.

            Use `gh pr diff ${{ github.event.pull_request.number }}` to get the diff, then `gh pr comment` to post findings.

          model: claude-haiku-4-5-20251001
          claude_args: '--max-turns 6 --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

