name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "frontend/src/**/*.js"
      - "frontend/src/**/*.jsx"
      - "backend/**/*.py"

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You have exactly 2 steps. Do not deviate.

            STEP 1: Run this exact command to get the diff (excluding lock files and generated code):
            gh pr diff ${{ github.event.pull_request.number }} -- ':(exclude)*.lock' ':(exclude)package-lock.json' ':(exclude)frontend/src/components/admin-ui/*' ':(exclude)frontend/src/components/ui/*' ':(exclude)docs-site/*'

            STEP 2: Review the diff for ONLY these issues (max 5 findings):
            - Security vulnerabilities (XSS, injection, auth bypass, secrets in code)
            - Bugs that will cause runtime errors, data loss, or incorrect behavior
            - Breaking API contract changes (missing migrations, mismatched types)

            Skip: docs, style, formatting, tests, suggestions outside PR scope.

            Then post findings with: gh pr comment ${{ github.event.pull_request.number }} --body "<your findings>"
            Format: one sentence + file:line per finding. No summary. No preamble.
            If nothing found, post "No issues found."

          model: claude-haiku-4-5-20251001
          claude_args: '--max-turns 12 --allowed-tools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

