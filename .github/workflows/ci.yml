name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Install pip-tools and dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          pip install ./shared/python
          cd backend
          pip install -r requirements-dev.txt

      # Run code formatting checks
      - name: Check code formatting
        run: |
          cd backend
          echo "Checking import sorting..."
          isort . --check-only --diff
          echo "Checking code formatting..."
          black . --check --diff

      # Run linting
      - name: Run linting
        run: |
          cd backend
          echo "Running flake8 linting..."
          flake8 . --statistics

      # Run tests with coverage
      - name: Run tests
        env:
          GCS_BUCKET_NAME: test-bucket
          GOOGLE_CLOUD_PROJECT: test-project
          MONGO_USER: test-user
          MONGO_PASSWORD: test-password
          MONGO_CLUSTER: test-cluster
          MONGO_APP_NAME: test-app
          MONGO_HOST: test.mongodb.net
          MONGO_DB_NAME: test-db
          ADMIN_EMAIL: test@example.com
        run: |
          cd backend
          echo "Running tests..."
          pytest -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml

      # Upload coverage to codecov (optional)
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: success()
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Check TypeScript
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run unit tests
        run: |
          cd frontend
          npm run test:unit

      - name: Verify build
        run: |
          cd frontend
          npm run build