services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5001}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-dummy}
        NEXT_PUBLIC_DEV_AUTH: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    env_file:
      - .env
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - MONGO_URI=mongodb://mongo:27017/${MONGO_DB_NAME:-ghostmonk}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-ghostmonk}
      - LOCAL_STORAGE_PATH=/app/local-uploads
      - ALLOW_DEV_AUTH=true
      - BACKEND_URL=http://localhost:5001
      - GH_TOKEN=${GH_TOKEN:-}
      - GH_USERNAME=${GH_USERNAME:-}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
    volumes:
      - ./local-uploads:/app/local-uploads
      - ./gcp-credentials.json:/app/backend/gcp-credentials.json:ro
    depends_on:
      mongo:
        condition: service_started
      qdrant:
        condition: service_started

  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
  qdrant_data:
