services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    env_file:
      - .env
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongo:27017/${MONGO_DB_NAME:-ghostmonk}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-ghostmonk}
      - BACKEND_URL=http://backend:5001
      - LOCAL_STORAGE_PATH=/app/local-uploads
    volumes:
      - ./backend:/app
      - ./shared/python:/shared/python
      - ./local-uploads:/app/local-uploads
    depends_on:
      mongo:
        condition: service_started
    # Overrides Dockerfile CMD — migrations must be run separately via `make migrate-up`
    command: uvicorn app:app --host 0.0.0.0 --port 5001 --reload

  frontend:
    build:
      context: ./frontend
      target: build
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - BACKEND_URL=http://backend:5001
      - UNSAFE_EVAL=${UNSAFE_EVAL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_DEBUG=${NEXTAUTH_DEBUG}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev:docker

  mongo:
    image: mongo:6.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
